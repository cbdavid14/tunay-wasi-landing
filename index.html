          "text": "Tunay Wasi es un marketplace peruano de café de especialidad que conecta directamente a caficultores (productores) con cafeterías, restaurantes, hoteles y consumidores finales. Operado por AL PASO LIVE S.A.C. (RUC 20615431631), con sede en Lima, Perú."

        "@type": "Question",
        "name": "¿Puedo comprar café verde sin tostar en Perú por internet?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sí. En Tunay Wasi puedes comprar café verde (sin tostar) directamente de caficultores peruanos de regiones como Cajamarca, San Martín, Amazonas y Cusco. El café verde está disponible para compradores B2B (cafeterías, tostadores, restaurantes) con RUC activo y cuenta aprobada. Los lotes vienen con evidencia de calidad verificada (región, altitud, variedad, proceso y, en lotes premium, informe de catación)."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cómo funciona el marketplace de café de especialidad Tunay Wasi?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Los caficultores publican sus lotes (café verde, tostado en grano o molido) con trazabilidad completa. Los compradores eligen, pagan por escrow (el dinero queda retenido hasta confirmar entrega) y reciben el café directamente del productor vía courier. El caficultor recibe hasta el 50% del precio neto — el doble del comercio justo tradicional."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cómo vendo mi café de especialidad online como caficultor peruano?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Regístrate en Tunay Wasi con tu DNI o RUC, publica tu lote indicando región, altitud, variedad, proceso y precio, y conecta directamente con cafeterías y negocios. Durante la fase beta la plataforma no cobra comisión — vendes y cobras el 100% de tu precio. El pago llega a tu Yape o cuenta bancaria cuando el comprador confirma la entrega."
        }
      },
      {
        "@type": "Question",
        "name": "¿Qué regiones cafetaleras de Perú están en Tunay Wasi?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Tunay Wasi cuenta con caficultores de Cajamarca (San Ignacio, La Coipa), San Martín (Moyobamba), Puno (Sandia) y Cusco (Valle Sagrado). Todos los lotes provienen de altitudes sobre los 1,600 msnm y cuentan con evidencia de calidad verificada: datos de origen, proceso, variedad y en lotes premium informe de catación por Q-Grader."
