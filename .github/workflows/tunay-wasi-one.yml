name: Deploy → ONE PROD (tunay-wasi-mvp.web.app)

on:
  push:
    branches: [main_one]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch o commit a desplegar'
        required: false
        default: 'main_one'

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Build & Deploy ONE PROD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (${{ github.ref_name || inputs.ref || 'main_one' }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build ONE → dist/mvp
        run: npm run build:mvp
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_TUNAY_WASI }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_TUNAY_WASI }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID_TUNAY_WASI }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_TUNAY_WASI }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_TUNAY_WASI }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID_TUNAY_WASI }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID_TUNAY_WASI }}
          VITE_FIRESTORE_DATABASE: default
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_PRIVATE_KEY: ${{ secrets.VITE_EMAILJS_PRIVATE_KEY }}

      - name: Deploy → tunay-wasi-mvp.web.app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUNAY_WASI }}
          projectId: tunay-wasi
          channelId: live
          target: mvp
